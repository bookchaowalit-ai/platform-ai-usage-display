# CI + security baseline. Public repository: GitHub-hosted runners.
# Shared workflows: bookchaowalit/platform-ci-workflows v1.1.1 (SHA-pinned).
name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      working-directory: backend
      node-version: "22"
      require-tests: true # ADR-0004: fail if the test script disappears
      # Measured line coverage of backend/src (2026-10-23, Vitest 5 v8): 74.35%, rounded down.
      coverage-threshold: "74"
      # Typecheck runs the `typecheck` script (auto). Build, then syntax-check the helper scripts.
      build-command: npm run build && for f in scripts/*.mjs; do node --check "$f"; done

  # The ESP32 sketch needs arduino-cli + board cores; until that is wired up,
  # at least make sure the real secrets header is never committed.
  firmware-hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: secrets.h is not tracked
        run: |
          if git ls-files firmware | grep -E '/secrets\.h$'; then
            echo "firmware secrets.h must not be committed" >&2
            exit 1
          fi

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
